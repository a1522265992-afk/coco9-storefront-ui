name: Editorial shop checks
on:
  push:
    branches:
      - feat/editorial-manual-orders-mvp
  pull_request:
    branches:
      - main
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit tests
        run: npm test
      - name: Build static storefront
        run: npm run build:shop
